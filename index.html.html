<style>

.cr .card,.cr.card{background:rgba(14,12,20,.9)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd);border-radius:12px;margin-top:12px}.stats div{padding:14px;display:flex;gap:12px;align-items:center;border-right:1px solid var(--bd)}.stats div:last-child{border:0}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px}

label{font-size:12px;color:var(--mu)}

@media(max-width:860px){body{padding:0}.app{grid-template-columns:1fr;height:100vh;border-radius:0;border:0;padding:0}aside{position:fixed;inset:0 30% 0 0;z-index:5;background:#050306;transform:translateX(-100%);transition:.2s;padding:12px}aside.open{transform:none}.menu{display:inline-flex}.grid3,.grid2,.cards{grid-template-columns:1fr}.dock{padding:0 12px 12px}.msgs{padding:10px 14px}.stats{grid-template-columns:1fr}}

let U=null,conv=null,msgs=[],busy=false,mode='chat',project=null;

function boot(){
 if(!sb){$('#root').innerHTML=`<div id="auth" class="card"><div class="orb" style="margin:0 auto 16px"></div><h2>Setup needed</h2><p class="mu" style="margin:10px 0">Open <b>index.html</b> and check your CFG keys.</p></div>`;return}
 sb.auth.getSession().then(({data})=>{U=data.session?.user||null;U?shell():login()});
}
function login(){$('#root').innerHTML=`<div id="auth" class="card"><div class="orb" style="margin:0 auto 12px"></div><h2>VENOM V1</h2><p class="mu" style="margin-bottom:14px">Sign in to continue</p><input id="em" class="f" type="email" placeholder="Email" autocomplete="email"><input id="pw" class="f" type="password" placeholder="Password" autocomplete="current-password"><button class="btn p" id="si" style="width:100%;justify-content:center">Sign in</button><button class="btn" id="su" style="width:100%;justify-content:center;margin-top:8px">Create account</button></div>`;
 const go=async(up)=>{const e=$('#em').value,p=$('#pw').value;const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);if(up&&!r.data.session)return toast('Check your email to confirm, then sign in.');U=r.data.user;shell()};
 $('#si').onclick=()=>go(0);$('#su').onclick=()=>go(1)}
const NAV=[['chat','Chat','chat','#/chat'],['archived','Archived','arch','#/archived'],['library','Library','lib','#/library']];
const WS=[['image','Image Generator','img','#/mode/image'],['slides','AI Presentation','sl','#/mode/slides'],['dev','Developer Assistant','code','#/mode/dev']];

 const item=a=>`<a class="nav" data-k="${a[0]}" href="${a[3]}" style="text-decoration:none">${ic(a[2])}${a[1]}</a>`;
 $('#root').innerHTML=`<div class="app"><aside id="sd"><div class="brand"><span class="logo"></span>VENOM V1</div>
 <button class="newchat" id="nc">${ic('plus')}New Chat</button><h6>Features</h6>${NAV.map(item).join('')}
 <h6>Workspaces</h6><button class="nav" id="np">${ic('fold')}New Project</button>${WS.map(item).join('')}
 <h6>Account</h6>${ACC.map(item).join('')}<button class="nav" id="so">${ic('out')}Sign out</button>
 <div class="up">${ic('spark')}<b>Credits</b><span id="upb">…</span><button id="upg">Billing</button></div></aside><main id="mn"></main></div>`;
 $('#nc').onclick=()=>{conv=null;msgs=[];project=null;mode='chat';location.hash='#/chat';route()};
 $('#np').onclick=()=>{const n=prompt('Project name');if(n){project=n.trim();conv=null;msgs=[];mode='chat';location.hash='#/chat';toast('Project "'+project+'" — new chats are saved into it');route()}};
 $('#so').onclick=async()=>{await sb.auth.signOut();U=null;login()};$('#upg').onclick=()=>location.hash='#/billing';
 route();refreshBal()}
async function refreshBal(){const{data}=await sb.from('profiles').select('*').single();if(data&&$('#upb'))$('#upb').textContent=data.credit_balance.toLocaleString()+' credits left';return data}

function route(){const h=location.hash.split('/');const v=h[1]||'chat';const m=$('#mn');if(!m)return;
 document.querySelectorAll('.nav[data-k]').forEach(a=>a.classList.toggle('on',a.dataset.k===(v==='mode'?h[2]:v)));

 if(v==='chat'){if(h[2]&&h[2]!==conv)return openConv(h[2]);return chatView()}
 ({archived:listView,library:listView,credits:creditsView,api:apiView,keys:keysView,billing:billingView,settings:settingsView}[v]||chatView)(v)}
const menuBtn=`<button class="pill menu" onclick="$('#sd').classList.toggle('open')" aria-label="Menu">${ic('menu')}</button>`;

 <div style="display:flex;gap:8px"><a class="pill" href="#/settings" style="color:inherit;text-decoration:none">Configuration ${ic('gear')}</a><button class="pill" id="ex">Export ${ic('exp')}</button>${conv?`<button class="pill" id="ar">Archive ${ic('arch')}</button>`:''}</div></div>
 ${msgs.length?`<div class="msgs" id="ms"></div>`:`<div class="hero"><div class="orb"></div><h1>${mode==='chat'?'Ready to Create Something New?':({image:'What shall we picture?',slides:'Let’s build a deck',dev:'What are we building?'})[mode]}</h1>${project?`<span class="tag">Project: ${esc(project)}</span>`:''}</div>`}
 <div class="dock">${msgs.length?'':`<div class="chips">${[['Create Image','img','Create an image of '],['Brainstorm','bulb','Brainstorm ideas for '],['Make a plan','sl','Make a plan for ']].map(c=>`<button class="pill ch" data-t="${c[2]}">${c[0]} ${ic(c[1])}</button>`).join('')}</div>`}

function renderMsgs(){
 const el=$('#ms');if(!el)return;
 el.innerHTML=msgs.map(m=>`
  <div class="m ${m.role==='user'?'u':'a'}">

  </div>`).join('');
 el.scrollTop=1e9;
}
function fmt(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c}</code></pre>`)}

async function generateVoice(text, index) {
 try {
  // Edge-TTS public cloud endpoint or local backend wrapper if hosted together
  const r = await fetch('https://edge-tts-api.hf.space/text-to-speech', { // or your python backend
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({text: text, voice: 'hi-IN-SwaraNeural'})
  });
  if(r.ok) {
   const blob = await r.blob();
   const url = URL.createObjectURL(blob);
   msgs[index].audioUrl = url;
   renderMsgs();
  }
 } catch(e) {
  // If voice server isn't hit, we gracefully skip audio without breaking chat
 }
}

async function send(){
 const inp=$('#in'),text=inp.value.trim();if(!text||busy)return;const s=S();
 if(!s.endpoint)return toast('Set your model endpoint in Settings first');
 busy=true;const model=$('#md')?.value;
 if(!conv){const{data,error}=await sb.from('conversations').insert({title:text.slice(0,48),project}).select().single();if(error){busy=false;return toast(error.message)}conv=data.id}
 const first=!msgs.length;msgs.push({role:'user',content:text});msgs.push({role:'assistant',content:''});const aiMsgIdx = msgs.length - 1;
 if(first)chatView();else{inp.value='';renderMsgs()}
 const sys=(MODES[mode]||{}).sys;const body={model,stream:true,messages:[...(sys?[{role:'system',content:sys}]:[]),...msgs.slice(0,-2)]};
 await sb.from('messages').insert({conversation_id:conv,role:'user',content:text,model});
 const t0=Date.now();let ok=true,out='';
 try{const r=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(s.apikey?{Authorization:'Bearer '+s.apikey}:{})},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Model server returned '+r.status);
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;try{const j=JSON.parse(d);out+=j.choices?.[0]?.delta?.content??j.choices?.[0]?.text??''}catch{}}
   msgs[aiMsgIdx].content=out;renderMsgs()}
 }catch(e){ok=false;out=out||'⚠ '+e.message;msgs[aiMsgIdx].content=out;renderMsgs();toast(e.message)}
 
 // Trigger Voice Generation after text is complete
 if(ok && out) { generateVoice(out, aiMsgIdx); }

 const credits=Math.max(1,Math.ceil((text.length+out.length)/4/1000));
 await sb.from('usage_events').insert({model,credits:ok?credits:0,status:ok?'success':'error',duration_ms:Date.now()-t0,kind:mode});
 if(ok)await sb.from('messages').insert({conversation_id:conv,role:'assistant',content:out,model});
 busy=false;refreshBal()}

function smooth(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length;i++){const mx=(p[i-1][0]+p[i][0])/2;d+=` C${mx},${p[i-1][1]} ${mx},${p[i][1]} ${p[i][0]},${p[i][1]}`}return d}
function chart(vals,labels,color,id,smoothLine=true,W=700,H=230){
 const mx=Math.max(...vals,1),pts=vals.map((v,i)=>[20+i*(W-40)/Math.max(vals.length-1,1),H-24-(v/mx)*(H-60)]);
 const d=smoothLine?smooth(pts):'M'+pts.map(p=>p.join(',')).join(' L');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".5"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
 ${pts.map(p=>`<line x1="${p[0]}" x2="${p[0]}" y1="10" y2="${H-24}" stroke="var(--grid)" stroke-dasharray="3 4"/>`).join('')}
 <path d="${d} L${pts.at(-1)[0]},${H-24} L${pts[0][0]},${H-24}Z" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:3.5}" fill="${i===pts.length-1?'var(--yellow)':color}"><title>${labels[i]}:${vals[i]}</title></circle>`).join('')}</svg>`}

 const go=async(up)=>{const e=$('#em').value,p=$('#pw').value;const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);if(up&&!r.data.session)return toast('Check your email to confirm, then sign in.');U=r.data.user;shell()};

 const item=a=>`<a class="nav" data-k="${a[0]}" href="${a[3]}" style="text-decoration:none">${ic(a[2])}${a[1]}</a>`;
 $('#root').innerHTML=`<div class="app"><aside id="sd"><div class="brand"><span class="logo"></span>VENOM V1</div>
 <button class="newchat" id="nc">${ic('plus')}New Chat</button><h6>Features</h6>${NAV.map(item).join('')}
 <h6>Workspaces</h6><button class="nav" id="np">${ic('fold')}New Project</button>${WS.map(item).join('')}
 <h6>Account</h6>${ACC.map(item).join('')}<button class="nav" id="so">${ic('out')}Sign out</button>
 <div class="up">${ic('spark')}<b>Credits</b><span id="upb">…</span><button id="upg">Billing</button></div></aside><main id="mn"></main></div>`;
 $('#nc').onclick=()=>{conv=null;msgs=[];project=null;mode='chat';location.hash='#/chat';route()};
 $('#np').onclick=()=>{const n=prompt('Project name');if(n){project=n.trim();conv=null;msgs=[];mode='chat';location.hash='#/chat';toast('Project "'+project+'" — new chats are saved into it');route()}};
 $('#so').onclick=async()=>{await sb.auth.signOut();U=null;login()};$('#upg').onclick=()=>location.hash='#/billing';
 route();refreshBal()}
async function refreshBal(){const{data}=await sb.from('profiles').select('*').single();if(data&&$('#upb'))$('#upb').textContent=data.credit_balance.toLocaleString()+' credits left';return data}
addEventListener('hashchange',()=>U&&route());
function route(){const h=location.hash.split('/');const v=h[1]||'chat';const m=$('#mn');if(!m)return;
 document.querySelectorAll('.nav[data-k]').forEach(a=>a.classList.toggle('on',a.dataset.k===(v==='mode'?h[2]:v)));
 $('#sd')?.classList.remove('open');m.className=['api','keys','billing'].includes(v)?'mint':v==='credits'?'cr':'';
 if(v==='mode'){mode=h[2];conv=null;msgs=[];return chatView()}
 if(v==='chat'){if(h[2]&&h[2]!==conv)return openConv(h[2]);return chatView()}
 ({archived:listView,library:listView,credits:creditsView,api:apiView,keys:keysView,billing:billingView,settings:settingsView}[v]||chatView)(v)}

function chatView(){
 const m=$('#mn'),md=MODES[mode]||MODES.chat;
 m.innerHTML=`<div class="top"><div style="display:flex;gap:8px">${menuBtn}<label class="pill"><select id="md" aria-label="Model">${modelOpts().map(x=>`<option>${esc(x)}</option>`)}</select></label></div>
 <div style="display:flex;gap:8px"><a class="pill" href="#/settings" style="color:inherit;text-decoration:none">Configuration ${ic('gear')}</a><button class="pill" id="ex">Export ${ic('exp')}</button>${conv?`<button class="pill" id="ar">Archive ${ic('arch')}</button>`:''}</div></div>
 ${msgs.length?`<div class="msgs" id="ms"></div>`:`<div class="hero"><div class="orb"></div><h1>${mode==='chat'?'Ready to Create Something New?':({image:'What shall we picture?',slides:'Let’s build a deck',dev:'What are we building?'})[mode]}</h1>${project?`<span class="tag">Project: ${esc(project)}</span>`:''}</div>`}
 <div class="dock">${msgs.length?'':`<div class="chips">${[['Create Image','img','Create an image of '],['Brainstorm','bulb','Brainstorm ideas for '],['Make a plan','sl','Make a plan for ']].map(c=>`<button class="pill ch" data-t="${c[2]}">${c[0]} ${ic(c[1])}</button>`).join('')}</div>`}
 <div class="comp"><textarea id="in" rows="2" placeholder="${md.ph||'Ask Anything…'}" aria-label="Message"></textarea>
 <div class="row"><button id="at">${ic('clip')}Attach</button><button id="st">${ic('gear')}Settings</button><button id="op">${ic('grid')}Options</button><span class="sp"></span><button class="mic" id="mc" aria-label="Voice">${ic('mic')}</button><button class="send" id="sn" aria-label="Send">${ic('send')}</button></div></div>
 ${msgs.length?'':`<div class="cards">${[['img','Image Generator','Create Image','Create high-quality images instantly from text.','image'],['sl','AI Presentation','Make Slides','Turn ideas into engaging, professional presentations.','slides'],['code','Dev Assistant','Generate Code','Generate clean, production ready code in seconds.','dev']].map(c=>`<button class="fc" data-m="${c[4]}"><div>${ic(c[0])}<span class="tag">${c[2]}</span></div><b>${c[1]}</b>${c[3]}</button>`).join('')}</div>`}</div>`;
 if(msgs.length)renderMsgs();
 const inp=$('#in');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#sn').onclick=send;
 document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{inp.value=b.dataset.t;inp.focus()});
 document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>location.hash='#/mode/'+b.dataset.m);
 $('#st').onclick=$('#op').onclick=()=>location.hash='#/settings';
 $('#at').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.txt,.md,.json,.csv,.js,.py,.html';f.onchange=async()=>{const t=await f.files[0].text();inp.value+=`\n\n[${f.files[0].name}]\n`+t.slice(0,20000)};f.click()};
 $('#mc').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input not supported in this browser');const r=new R();r.onresult=e=>inp.value+=e.results[0][0].transcript;r.start();toast('Listening…')};
 $('#ex').onclick=()=>{if(!msgs.length)return toast('Nothing to export yet');const b=new Blob([msgs.map(x=>`## ${x.role}\n${x.content}`).join('\n\n')],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chat.md';a.click()};

function renderMsgs(){
 const el=$('#ms');if(!el)return;
 el.innerHTML=msgs.map(m=>`
  <div class="m ${m.role==='user'?'u':'a'}">
    ${fmt(m.content)}
    ${m.audioUrl ? `<br><audio controls src="${esc(m.audioUrl)}"></audio>` : ''}
  </div>`).join('');
 el.scrollTop=1e9;
}
function fmt(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c}</code></pre>`)}

async function generateVoice(text, index) {
 try {
  // Edge-TTS public cloud endpoint or local backend wrapper if hosted together
  const r = await fetch('https://edge-tts-api.hf.space/text-to-speech', { // or your python backend
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({text: text, voice: 'hi-IN-SwaraNeural'})
  });
  if(r.ok) {
   const blob = await r.blob();
   const url = URL.createObjectURL(blob);
   msgs[index].audioUrl = url;
   renderMsgs();
  }
 } catch(e) {
  // If voice server isn't hit, we gracefully skip audio without breaking chat
 }
}

async function send(){
 const inp=$('#in'),text=inp.value.trim();if(!text||busy)return;const s=S();
 if(!s.endpoint)return toast('Set your model endpoint in Settings first');
 busy=true;const model=$('#md')?.value;
 if(!conv){const{data,error}=await sb.from('conversations').insert({title:text.slice(0,48),project}).select().single();if(error){busy=false;return toast(error.message)}conv=data.id}
 const first=!msgs.length;msgs.push({role:'user',content:text});msgs.push({role:'assistant',content:''});const aiMsgIdx = msgs.length - 1;
 if(first)chatView();else{inp.value='';renderMsgs()}
 const sys=(MODES[mode]||{}).sys;const body={model,stream:true,messages:[...(sys?[{role:'system',content:sys}]:[]),...msgs.slice(0,-2)]};
 await sb.from('messages').insert({conversation_id:conv,role:'user',content:text,model});
 const t0=Date.now();let ok=true,out='';
 try{const r=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(s.apikey?{Authorization:'Bearer '+s.apikey}:{})},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Model server returned '+r.status);
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;try{const j=JSON.parse(d);out+=j.choices?.[0]?.delta?.content??j.choices?.[0]?.text??''}catch{}}
   msgs[aiMsgIdx].content=out;renderMsgs()}
 }catch(e){ok=false;out=out||'⚠ '+e.message;msgs[aiMsgIdx].content=out;renderMsgs();toast(e.message)}
 
 // Trigger Voice Generation after text is complete
 if(ok && out) { generateVoice(out, aiMsgIdx); }

 const credits=Math.max(1,Math.ceil((text.length+out.length)/4/1000));
 await sb.from('usage_events').insert({model,credits:ok?credits:0,status:ok?'success':'error',duration_ms:Date.now()-t0,kind:mode});
 if(ok)await sb.from('messages').insert({conversation_id:conv,role:'assistant',content:out,model});
 busy=false;refreshBal()}

async function listView(v){

 const{data,error}=await sb.from('conversations').select('*').eq('archived',arch).order('created_at',{ascending:false});
 const pg=$('.pg');if(error)return pg.lastChild.outerHTML=`<div class="hint">${esc(error.message)}</div>`;
 if(!data.length)return pg.lastChild.outerHTML=`<div class="hint">Nothing here yet.</div>`;
 const g={};data.forEach(c=>(g[c.project||'No project']??=[]).push(c));
 pg.lastChild.outerHTML=Object.entries(g).map(([p,cs])=>`${arch?'':`<h6 class="mu" style="margin:14px 0 8px;font-weight:400">${esc(p)}</h6>`}<div class="list">${cs.map(c=>`<div><a href="#/chat/${c.id}" style="color:inherit;text-decoration:none;flex:1">${esc(c.title)}<span class="mu" style="font-size:12px"> · ${new Date(c.created_at).toLocaleDateString()}</span></a><button class="btn" data-a="${c.id}">${arch?'Restore':'Archive'}</button><button class="btn" data-d="${c.id}">Delete</button></div>`).join('')}</div>`).join('');
 pg.onclick=async e=>{const a=e.target.closest('[data-a]'),d=e.target.closest('[data-d]');if(a){await sb.from('conversations').update({archived:!arch}).eq('id',a.dataset.a);listView()}if(d&&confirm('Delete this conversation permanently?')){await sb.from('conversations').delete().eq('id',d.dataset.d);listView()}}}
function smooth(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length;i++){const mx=(p[i-1][0]+p[i][0])/2;d+=` C${mx},${p[i-1][1]} ${mx},${p[i][1]} ${p[i][0]},${p[i][1]}`}return d}
function chart(vals,labels,color,id,smoothLine=true,W=700,H=230){
 const mx=Math.max(...vals,1),pts=vals.map((v,i)=>[20+i*(W-40)/Math.max(vals.length-1,1),H-24-(v/mx)*(H-60)]);
 const d=smoothLine?smooth(pts):'M'+pts.map(p=>p.join(',')).join(' L');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".5"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
 ${pts.map(p=>`<line x1="${p[0]}" x2="${p[0]}" y1="10" y2="${H-24}" stroke="var(--grid)" stroke-dasharray="3 4"/>`).join('')}
 <path d="${d} L${pts.at(-1)[0]},${H-24} L${pts[0][0]},${H-24}Z" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:3.5}" fill="${i===pts.length-1?'var(--yellow)':color}"><title>${labels[i]}:${vals[i]}</title></circle>`).join('')}</svg>`}
async function usage(days){const since=new Date(Date.now()-days*864e5).toISOString();const{data,error}=await sb.from('usage_events').select('*').gte('created_at',since).order('created_at',{ascending:false});return{data:data||[],error}}
async function creditsView(){
 const m=$('#mn');m.innerHTML=`<div class="top">${menuBtn}<span></span></div><div class="pg"><div class="spin"></div></div>`;
 const[pr,u]=await Promise.all([refreshBal(),usage(14)]);if(u.error||!pr)return $('.pg').innerHTML=`<div class="hint">${esc(u.error?.message||'No profile found — run schema.sql')}</div>`;
 const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5);return d.toISOString().slice(0,10)});
 const per=days.map(d=>u.data.filter(e=>e.created_at.slice(0,10)===d).reduce((a,e)=>a+e.credits,0));
 const used=pr.credit_total-pr.credit_balance,pct=Math.round(used/pr.credit_total*100);const models=new Set(u.data.map(e=>e.model)).size,kinds=new Set(u.data.map(e=>e.kind)).size;
 const k=n=>n>=1000?(n/1000).toFixed(1)+'K':n;
 $('.pg').innerHTML=`<div class="card" style="padding:28px;max-width:760px;margin:0 auto;background:rgba(14,12,20,.9)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="display:flex;gap:16px;align-items:center"><div class="ico" style="width:52px;height:52px;background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.4);border-radius:14px">${ic('spark')}</div><h1 style="font-weight:500">AI Credit System</h1></div><div class="mu">Balance<div style="color:#fff;font-size:22px;font-weight:500">${pr.credit_balance.toLocaleString()} <span class="mu" style="font-size:13px">credits</span></div></div></div>
 <div class="card" style="padding:8px;background:var(--s1)">${u.data.length?chart(per,days,'var(--pink)',1):'<div class="hint" style="margin:20px">No usage yet — send a message to see your credit graph.</div>'}</div>
 <div class="card" style="margin-top:12px;display:flex;align-items:center;gap:24px;padding:16px 20px"><div class="mu">Credits used<div style="color:#fff;font-size:24px;font-weight:500">${k(used)} <span class="mu" style="font-size:13px">/ ${k(pr.credit_total)}</span></div></div><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><b style="color:var(--pink);font-size:18px">${pct}%</b></div>
 <div class="stats">${[['db','Queries',u.data.length,'var(--indigo)'],['grid','Models',models,'var(--yellow)'],['cpu','Modes',kinds,'var(--pink)']].map(s=>`<div><span class="ico" style="background:rgba(255,255,255,.06);color:${s[3]}">${ic(s[0])}</span><span class="mu">${s[1]}<br><b style="color:#fff">${s[2]}</b></span></div>`).join('')}</div><p class="mu" style="margin-top:10px;font-size:12px">Last 14 days · 1 credit ≈ 1K tokens (estimated)</p></div>`}
let rng='today';
async function apiView(){
 const m=$('#mn');m.innerHTML=`<div class="top">${menuBtn}<span class="mu">API Dashboard</span><span class="ico" style="background:var(--s3);color:#fff;border-radius:50%">${esc((U.email||'U').slice(0,2).toUpperCase())}</span></div><div class="pg"><div class="spin"></div></div>`;
 const[pr,u]=await Promise.all([refreshBal(),usage(7)]);if(u.error||!pr)return $('.pg').innerHTML=`<div class="hint">${esc(u.error?.message||'No profile found — run schema.sql')}</div>`;
 const today=new Date().toISOString().slice(0,10),td=u.data.filter(e=>e.created_at.slice(0,10)===today),ok=td.filter(e=>e.status==='success').length,rate=td.length?Math.round(ok/td.length*100):null;
 const lab=rng==='today'?[...Array(24)].map((_,i)=>String(i).padStart(2,'0')+':00'):[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10));
 const vals=rng==='today'?lab.map((_,h)=>td.filter(e=>new Date(e.created_at).getHours()===h).length):lab.map(d=>u.data.filter(e=>e.created_at.slice(0,10)===d).length);
 const pm={};u.data.forEach(e=>pm[e.model]=(pm[e.model]||0)+1);const pop=Object.entries(pm).sort((a,b)=>b[1]-a[1]);
 $('.pg').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>Dashboard</h1><p class="sub">Welcome back! Here's an overview of your API usage.</p></div><button class="btn" id="rf">${ic('ref')}Refresh Balance</button></div>
 <div class="grid3"><div class="card"><div style="display:flex;justify-content:space-between" class="mu">Current Balance<span class="ico">${ic('dollar')}</span></div><div class="big">${pr.credit_balance.toLocaleString()}</div><span class="mu">credits</span></div>
 <div class="card"><div style="display:flex;justify-content:space-between" class="mu">Today's API Calls<span class="ico" style="background:#e0e7ff;color:#4338ca">${ic('bolt')}</span></div><div class="big">${td.length}</div><span class="mu">${td.reduce((a,e)=>a+e.credits,0)} credits spent</span></div>
 <div class="card"><div style="display:flex;justify-content:space-between" class="mu">Success Rate<span class="ico">${ic('trend')}</span></div><div class="big">${rate===null?'—':rate+'%'}</div><span class="mu">Today's requests</span>${rate!==null?`<div><span class="badge ${rate<90?'err':''}" style="margin-top:6px">${rate>=95?'Excellent':rate>=90?'Good':'Needs attention'}</span></div>`:''}</div></div>
 <div class="grid2"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>API Usage Trend</b><span style="display:flex;gap:4px;background:var(--s2);padding:4px;border-radius:10px"><button class="btn" data-r="today" style="${rng==='today'?'background:var(--mint);color:#052e26;border-color:var(--mint)':'border-color:transparent'}">Today</button><button class="btn" data-r="7d" style="${rng==='7d'?'background:var(--mint);color:#052e26;border-color:var(--mint)':'border-color:transparent'}">7 Days</button></span></div><div class="big" style="font-size:22px">${vals.reduce((a,b)=>a+b,0)} <span class="mu" style="font-size:13px;font-weight:400">total calls ${rng==='today'?'today':'this week'}</span></div><div style="background:var(--s1);border-radius:10px;padding:6px">${chart(vals,lab,'var(--mint)',2,false,520,200)}</div></div>
 <div class="card"><b>Popular Models</b><div class="big" style="font-size:22px">${pop.length} <span class="mu" style="font-size:13px;font-weight:400">models used this week</span></div>${pop.length?pop.map(([n,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:12px 0"><span style="color:var(--mint)">${ic('bolt')}</span><span style="flex:1">${esc(n)}</span><span class="pill" style="background:#fff;color:#000;padding:1px 10px">${Math.round(c/u.data.length*100)}%</span><span class="mu" style="width:34px;text-align:right">${c}</span></div>`).join(''):'<div class="hint" style="margin-top:14px">No calls yet.</div>'}</div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b>Recent Activity</b><a class="btn" href="#/library" style="text-decoration:none;color:inherit">View All ${ic('exp')}</a></div><div class="list">${u.data.slice(0,6).map(e=>`<div><span style="display:flex;gap:10px;align-items:center">${ic('trend')}<b style="font-weight:500">${esc(e.model||'model')}</b><span class="badge ${e.status==='success'?'':'err'}" style="font-size:10px">${e.status}</span></span><span class="mu">${new Date(e.created_at).toLocaleString()} ·${e.duration_ms?(e.duration_ms/1000).toFixed(1)+'s':'—'}</span></div>`).join('')||'<div class="hint">No activity yet.</div>'}</div></div>`;
 $('#rf').onclick=()=>{apiView();toast('Balance refreshed')};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rng=b.dataset.r;apiView()})}
async function keysView(){
 const m=$('#mn');m.innerHTML=`<div class="top">${menuBtn}<span class="mu">API Keys</span><span></span></div><div class="pg"><h1>API Keys</h1><p class="sub">Manage your API keys</p><div class="card" style="margin-bottom:16px"><label>Key name</label><input id="kn" class="f" placeholder="e.g. Production"><button class="btn p" id="kc">Create key</button><div id="kn2"></div></div><div id="kl"><div class="spin"></div></div></div>`;
 const load=async()=>{const{data,error}=await sb.from('api_keys').select('*').order('created_at',{ascending:false});$('#kl').innerHTML=error?`<div class="hint">${esc(error.message)}</div>`:data.length?`<div class="list">${data.map(k=>`<div><span><b style="font-weight:500">${esc(k.name)}</b> <span class="mu">${esc(k.key_prefix)}… · ${new Date(k.created_at).toLocaleDateString()}</span> ${k.revoked?'<span class="badge err">revoked</span>':''}</span>${k.revoked?'':`<button class="btn" data-k="${k.id}">Revoke</button>`}</div>`).join('')}</div>`:'<div class="hint">No keys yet.</div>';
  $('#kl').onclick=async e=>{const b=e.target.closest('[data-k]');if(b){await sb.from('api_keys').update({revoked:true}).eq('id',b.dataset.k);load()}}};load();
 $('#kc').onclick=async()=>{const n=$('#kn').value.trim();if(!n)return toast('Enter a name');const raw='vk_'+[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const{error}=await sb.from('api_keys').insert({name:n,key_prefix:raw.slice(0,9),key_hash:h});if(error)return toast(error.message);
  $('#kn2').innerHTML=`<div class="hint" style="margin-top:12px">Copy now — it won't be shown again:<br><code style="color:var(--mint);word-break:break-all">${raw}</code></div>`;$('#kn').value='';load()}}
async function billingView(){
 const m=$('#mn');m.innerHTML=`<div class="top">${menuBtn}<span class="mu">Billing</span><span></span></div><div class="pg"><div class="spin"></div></div>`;
 const[pr,u]=await Promise.all([refreshBal(),usage(30)]);if(!pr)return $('.pg').innerHTML=`<div class="hint">No profile found — run schema.sql</div>`;
 $('.pg').innerHTML=`<h1>Billing</h1><p class="sub">Credits and payments</p><div class="grid3"><div class="card"><span class="mu">Balance</span><div class="big">${pr.credit_balance.toLocaleString()}</div></div><div class="card"><span class="mu">Plan allowance</span><div class="big">${pr.credit_total.toLocaleString()}</div></div><div class="card"><span class="mu">Spent (30 days)</span><div class="big">${u.data.reduce((a,e)=>a+e.credits,0)}</div></div></div>
 <div class="hint" style="margin-bottom:16px">No payment provider is connected yet, so purchasing credits is disabled. Connect Stripe (Edge Function + webhook that updates <code>profiles.credit_total</code>) to enable it.</div><button class="btn p" disabled>Buy credits</button>`}
function settingsView(){
 const s=S(),m=$('#mn');m.innerHTML=`<div class="top">${menuBtn}<span class="mu">Settings</span><span></span></div><div class="pg" style="max-width:640px"><h1>Settings</h1><p class="sub">Connect your own AI model (OpenAI-compatible /v1/chat/completions)</p><div class="card"><label>Endpoint URL</label><input id="se" class="f" value="${esc(s.endpoint||'')}" placeholder="https://your-host/v1/chat/completions"><label>Model API key (optional)</label><input id="sk" class="f" type="password" value="${esc(s.apikey||'')}"><label>Model names (comma separated)</label><input id="sm" class="f" value="${esc(s.models||'')}" placeholder="my-model-v1, my-model-fast"><button class="btn p" id="ss">Save</button></div><p class="mu" style="margin-top:12px;font-size:12px">Stored in this browser only. For production, put the model key behind a Supabase Edge Function so it never reaches the client; your model server must allow CORS.</p></div>`;
 $('#ss').onclick=()=>{localStorage.setItem('venom_s',JSON.stringify({endpoint:$('#se').value.trim(),apikey:$('#sk').value.trim(),models:$('#sm').value.trim()}));toast('Saved')}}
boot();
</script></body></html>
